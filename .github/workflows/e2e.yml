name: Playwright End-to-End Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    timeout-minutes: 20
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET || 'test-nextauth-secret-for-ci-runs-only-12345' }}
      NEXTAUTH_URL: 'http://localhost:3000'
      NEXT_PUBLIC_PAYSTACK_PUBLIC_KEY: 'pk_test_ci_mock_paystack_key'
      PAYSTACK_SECRET_KEY: 'sk_test_ci_mock_paystack_secret'
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://mock.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || 'mock-anon-key' }}
      ALLOW_TEST_EMAILS: 'true'

    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm ci

      - name: Install Playwright Browsers & Dependencies
        run: npx playwright install chromium --with-deps

      - name: Seed Database Test Fixtures
        run: npx tsx playwright/utils/seed.ts
        continue-on-error: true

      - name: Run Playwright E2E Tests
        run: npm run test:e2e:ci

      - name: Cleanup Database Test Fixtures
        if: always()
        run: npx tsx playwright/utils/cleanup.ts
        continue-on-error: true

      - name: Upload Test Report Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
